name: Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing v* tag matching the Cargo package version
        required: true
        default: v0.2.0
      draft:
        description: Leave the GitHub Release as a draft after verification
        type: boolean
        default: true
      require_windows_signing:
        description: Fail if Windows Authenticode signing secrets are missing
        type: boolean
        default: false
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  validate:
    name: Validate release inputs
    runs-on: windows-latest
    outputs:
      tag: ${{ steps.metadata.outputs.tag }}
      version: ${{ steps.metadata.outputs.version }}
      draft: ${{ steps.metadata.outputs.draft }}
    steps:
      - name: Checkout release tag
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt,clippy

      - name: Rust cache
        uses: Swatinem/rust-cache@v2

      - name: Validate tag and package version
        id: metadata
        shell: pwsh
        run: |
          $tag = if ("${{ github.event_name }}" -eq "workflow_dispatch") { "${{ inputs.tag }}" } else { "${{ github.ref_name }}" }
          if ($tag -notmatch '^v\d+\.\d+\.\d+(-[0-9A-Za-z.-]+)?$') {
            throw "Release tag must be semantic versioning with a v prefix; received $tag."
          }
          git rev-parse --verify "refs/tags/$tag" | Out-Null
          if ($LASTEXITCODE -ne 0) {
            throw "Release tag does not exist: $tag"
          }
          $version = (cargo metadata --no-deps --format-version 1 | ConvertFrom-Json).packages[0].version
          if ($tag -ne "v$version") {
            throw "Tag $tag does not match Cargo package version $version."
          }
          $draft = if ("${{ github.event_name }}" -eq "workflow_dispatch") { "${{ inputs.draft }}".ToLowerInvariant() } else { "true" }
          "tag=$tag" >> $env:GITHUB_OUTPUT
          "version=$version" >> $env:GITHUB_OUTPUT
          "draft=$draft" >> $env:GITHUB_OUTPUT

      - name: Format
        run: cargo fmt --check

      - name: Tests
        run: cargo test --locked

      - name: Clippy
        run: cargo clippy --locked --all-targets --all-features -- -D warnings

  windows:
    name: Windows x64
    needs: validate
    runs-on: windows-latest
    env:
      WINDOWS_CODESIGN_CERTIFICATE: ${{ secrets.WINDOWS_CODESIGN_CERTIFICATE }}
      WINDOWS_CODESIGN_PASSWORD: ${{ secrets.WINDOWS_CODESIGN_PASSWORD }}
      REQUIRE_WINDOWS_SIGNING: ${{ github.event_name == 'workflow_dispatch' && format('{0}', inputs.require_windows_signing) || 'false' }}
    steps:
      - name: Checkout release tag
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.validate.outputs.tag }}
          persist-credentials: false

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: Swatinem/rust-cache@v2

      - name: Build native executable
        run: cargo build --release --locked

      - name: Sign, package, and verify
        shell: pwsh
        run: |
          $arguments = @{ SkipBuild = $true }
          if ([System.Convert]::ToBoolean($env:REQUIRE_WINDOWS_SIGNING)) {
            $arguments.RequireSignature = $true
          }
          ./scripts/package-windows.ps1 @arguments

      - name: Upload Windows release artifacts
        uses: actions/upload-artifact@v7
        with:
          name: cedar-windows-release
          path: |
            dist-release/windows/Cedar_*_windows-x64.exe
            dist-release/windows/Cedar_*_windows-x64.zip
            dist-release/windows/SHA256SUMS-windows.txt
          if-no-files-found: error
          retention-days: 14

  macos:
    name: macOS universal
    needs: validate
    runs-on: macos-latest
    env:
      APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
      APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
      APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
    steps:
      - name: Checkout release tag
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.validate.outputs.tag }}
          persist-credentials: false

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - name: Rust cache
        uses: Swatinem/rust-cache@v2

      - name: Verify Apple release credentials
        shell: bash
        run: |
          set -euo pipefail
          for name in APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID; do
            [ -n "${!name:-}" ] || { echo "::error::$name is required for signed and notarized macOS releases"; exit 1; }
          done

      - name: Import signing certificate
        shell: bash
        run: |
          set -euo pipefail
          CERTIFICATE_PATH="$RUNNER_TEMP/cedar-certificate.p12"
          KEYCHAIN_PATH="$RUNNER_TEMP/cedar-signing.keychain-db"
          KEYCHAIN_PASSWORD="${KEYCHAIN_PASSWORD:-$(uuidgen)}"
          printf '%s' "$APPLE_CERTIFICATE" | base64 --decode > "$CERTIFICATE_PATH"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERTIFICATE_PATH" -P "$APPLE_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security default-keychain -s "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security find-identity -v -p codesigning "$KEYCHAIN_PATH"
          xcrun notarytool store-credentials cedar-release --apple-id "$APPLE_ID" --password "$APPLE_PASSWORD" --team-id "$APPLE_TEAM_ID" --validate

      - name: Build, sign, notarize, and package
        shell: bash
        run: |
          set -euo pipefail
          cargo build --release --locked --target aarch64-apple-darwin
          cargo build --release --locked --target x86_64-apple-darwin

          VERSION="${{ needs.validate.outputs.version }}"
          OUT="dist-release/macos"
          APP="$OUT/Cedar.app"
          mkdir -p "$APP/Contents/MacOS" "$APP/Contents/Resources"
          lipo -create \
            target/aarch64-apple-darwin/release/cedar \
            target/x86_64-apple-darwin/release/cedar \
            -output "$APP/Contents/MacOS/Cedar"
          cp assets/icon.icns "$APP/Contents/Resources/icon.icns"

          plutil -create xml1 "$APP/Contents/Info.plist"
          /usr/libexec/PlistBuddy \
            -c "Add :CFBundleDisplayName string Cedar" \
            -c "Add :CFBundleExecutable string Cedar" \
            -c "Add :CFBundleIdentifier string dev.oshtz.cedar" \
            -c "Add :CFBundleIconFile string icon.icns" \
            -c "Add :CFBundleInfoDictionaryVersion string 6.0" \
            -c "Add :CFBundleName string Cedar" \
            -c "Add :CFBundlePackageType string APPL" \
            -c "Add :CFBundleShortVersionString string $VERSION" \
            -c "Add :CFBundleVersion string $VERSION" \
            -c "Add :LSMinimumSystemVersion string 11.0" \
            -c "Add :NSHighResolutionCapable bool true" \
            "$APP/Contents/Info.plist"

          codesign --force --deep --options runtime --timestamp --sign "$APPLE_SIGNING_IDENTITY" "$APP"
          codesign --verify --deep --strict --verbose=2 "$APP"

          NOTARY_ZIP="$RUNNER_TEMP/Cedar-notary.zip"
          ditto -c -k --keepParent "$APP" "$NOTARY_ZIP"
          xcrun notarytool submit "$NOTARY_ZIP" --keychain-profile cedar-release --wait
          xcrun stapler staple "$APP"
          xcrun stapler validate "$APP"
          spctl --assess --type execute --verbose=2 "$APP"

          ditto -c -k --keepParent "$APP" "$OUT/Cedar_${VERSION}_macos.app.zip"
          STAGING="$RUNNER_TEMP/cedar-dmg"
          mkdir -p "$STAGING"
          cp -R "$APP" "$STAGING/Cedar.app"
          ln -s /Applications "$STAGING/Applications"
          hdiutil create -volname Cedar -srcfolder "$STAGING" -ov -format UDZO "$OUT/Cedar_${VERSION}_macos.dmg"
          codesign --force --timestamp --sign "$APPLE_SIGNING_IDENTITY" "$OUT/Cedar_${VERSION}_macos.dmg"
          xcrun notarytool submit "$OUT/Cedar_${VERSION}_macos.dmg" --keychain-profile cedar-release --wait
          xcrun stapler staple "$OUT/Cedar_${VERSION}_macos.dmg"
          xcrun stapler validate "$OUT/Cedar_${VERSION}_macos.dmg"
          spctl --assess --type open --context context:primary-signature --verbose=2 "$OUT/Cedar_${VERSION}_macos.dmg"

          cd "$OUT"
          shasum -a 256 Cedar_*_macos.dmg Cedar_*_macos.app.zip > SHA256SUMS-macos.txt
          shasum -a 256 -c SHA256SUMS-macos.txt

      - name: Upload macOS release artifacts
        uses: actions/upload-artifact@v7
        with:
          name: cedar-macos-release
          path: |
            dist-release/macos/Cedar_*_macos.dmg
            dist-release/macos/Cedar_*_macos.app.zip
            dist-release/macos/SHA256SUMS-macos.txt
          if-no-files-found: error
          retention-days: 14

  publish:
    name: Assemble GitHub release
    needs: [validate, windows, macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout release tag
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.validate.outputs.tag }}
          fetch-depth: 0
          persist-credentials: false

      - name: Download release artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: cedar-*-release
          path: dist-release
          merge-multiple: true

      - name: Verify complete artifact set
        env:
          CEDAR_VERSION: ${{ needs.validate.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          expected=(
            "Cedar_${CEDAR_VERSION}_windows-x64.exe"
            "Cedar_${CEDAR_VERSION}_windows-x64.zip"
            "SHA256SUMS-windows.txt"
            "Cedar_${CEDAR_VERSION}_macos.dmg"
            "Cedar_${CEDAR_VERSION}_macos.app.zip"
            "SHA256SUMS-macos.txt"
          )
          for file in "${expected[@]}"; do
            test -f "dist-release/$file" || { echo "::error::Missing release artifact $file"; exit 1; }
          done
          test "$(find dist-release -maxdepth 1 -type f | wc -l | tr -d ' ')" -eq "${#expected[@]}"
          (cd dist-release && sha256sum --check SHA256SUMS-windows.txt)
          (cd dist-release && sha256sum --check SHA256SUMS-macos.txt)

      - name: Create or update verified draft
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ needs.validate.outputs.tag }}
          CEDAR_VERSION: ${{ needs.validate.outputs.version }}
          LEAVE_AS_DRAFT: ${{ needs.validate.outputs.draft }}
        shell: bash
        run: |
          set -euo pipefail
          NOTES="$RUNNER_TEMP/cedar-release-notes.md"
          printf '%s\n' \
            "Cedar $CEDAR_VERSION" \
            "" \
            "Native Rust + GPUI desktop release." \
            "" \
            "Windows: standalone executable and zip bundle." \
            "macOS: signed and notarized universal DMG and app zip." \
            "SHA-256 manifests are included for both platforms." > "$NOTES"

          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            IS_DRAFT="$(gh release view "$RELEASE_TAG" --json isDraft --jq .isDraft)"
            [ "$IS_DRAFT" = "true" ] || { echo "::error::Release $RELEASE_TAG is already published and immutable"; exit 1; }
            gh release edit "$RELEASE_TAG" --title "Cedar $CEDAR_VERSION" --notes-file "$NOTES"
          else
            gh release create "$RELEASE_TAG" --verify-tag --draft --title "Cedar $CEDAR_VERSION" --notes-file "$NOTES"
          fi

          gh release upload "$RELEASE_TAG" dist-release/* --clobber
          if [ "$LEAVE_AS_DRAFT" = "false" ]; then
            gh release edit "$RELEASE_TAG" --draft=false
          fi
